---
kubeconfig_localhost: true
kubectl_localhost: true
container_manager: containerd
kube_network_plugin: calico
enable_nodelocaldns: false
dns_mode: coredns
# Terraform owns the local dnsmasq endpoint and publishes its address. Kubespray
# remains the sole owner of CoreDNS and forwards pod queries through that
# endpoint so the Terraform-owned platform zone and public DNS both resolve.
# NodeLocal DNS is disabled because Big Bang's default DNS NetworkPolicy
# selects the CoreDNS Pods, not a link-local hostNetwork cache.
upstream_dns_servers:
  - "{{ atum_dns_server }}"

# Kubespray owns the mounted authentication file and kubeadm flags. Atum hands
# it one complete projection from the active identity contract, including the
# validated root CA and anonymous access limited to /healthz, /livez, and
# /readyz, plus kubeadm's exact kube-public/cluster-info ConfigMap path before
# initial cluster creation. No platform component replaces the file later.
# Keep the legacy flag false as a fail-closed fallback whenever the structured
# configuration is not active.
kube_api_anonymous_auth: false
kube_apiserver_use_authentication_config_file: >-
  {{ (atum_kubernetes_oidc | default({})).enabled | default(false) }}
kube_apiserver_authentication_config_anonymous: >-
  {{ (atum_kubernetes_oidc | default({})).anonymous |
     default({'enabled': false}) }}
kube_apiserver_authentication_config_jwt: >-
  {{ (atum_kubernetes_oidc | default({})).jwt | default([]) }}

# Atum reconstructs Kubespray's official full offline inventory, including
# unselected CNI payloads. This is only the Cilium chart coordinate used by
# that inventory discovery; kube_network_plugin above remains authoritative.
cilium_version: "1.19.4"

# Kubespray's kube-vip documentation requires strict ARP when kube-proxy uses
# its default IPVS mode and the Flux-owned kube-vip release advertises service
# addresses in ARP mode.
kube_proxy_strict_arp: true
dns_min_replicas: 1
coredns_replicas: 1

# kubeadm's CreateJob upgrade check has a fixed 15-second deadline. On a busy
# control plane the Job can finish immediately after that deadline even though
# the scheduler, controller manager, and workload path are healthy. Keep all
# other preflight checks fatal; Atum's bounded pre/post upgrade health gates and
# the post-upgrade RBAC hook still fail closed around each sequential node.
kubeadm_ignore_preflight_errors:
  - CreateJob

post_upgrade_hooks:
  - "{{ inventory_dir }}/hooks/wait-admin-rbac.yml"

# Singleton workloads backed by local-path volumes cannot satisfy a
# zero-disruption PDB while their volume's node is cordoned. Give ordinary
# eviction time to move every portable workload, then use Kubespray's bounded
# fallback for the node-local remainder. The upgrade still fails closed if the
# fallback cannot drain the node.
drain_timeout: 180s
drain_retries: 1
drain_fallback_enabled: true
drain_fallback_timeout: 180s
drain_fallback_retries: 1
