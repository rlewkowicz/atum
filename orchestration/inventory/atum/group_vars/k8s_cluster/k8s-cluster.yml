---
kubeconfig_localhost: true
kubectl_localhost: true
container_manager: containerd
kube_owner: root
kube_network_plugin: cilium
kube_proxy_remove: true
enable_nodelocaldns: false
upstream_dns_servers:
  - 1.1.1.1
  - 8.8.8.8

# Kubespray owns the mounted authentication file and kubeadm flag. Atum hands
# it one complete projection from the active identity contract, including the
# validated root CA, before initial cluster creation. Anonymous GET access to
# /healthz is the sole exception required by the selected Kubespray API-server
# checks. No platform component replaces the file later.
kube_apiserver_use_authentication_config_file: >-
  {{ (atum_kubernetes_oidc | default({})).enabled | default(false) }}
kube_apiserver_authentication_config_anonymous: >-
  {{ (atum_kubernetes_oidc | default({})).anonymous |
     default({'enabled': kube_api_anonymous_auth, 'conditions': []}) }}
kube_apiserver_authentication_config_jwt: >-
  {{ (atum_kubernetes_oidc | default({})).jwt | default([]) }}

cilium_version: "1.19.4"
cilium_memory_limit: 2Gi
cilium_cpu_limit: 1000m
cilium_memory_requests: 256Mi
cilium_cpu_requests: 200m
cilium_operator_replicas: 1
cilium_install_extra_flags: "--wait --wait-duration 10m"
cilium_kube_proxy_replacement: true
cilium_dns_proxy_enable_transparent_mode: false
cilium_tunnel_mode: ""
cilium_auto_direct_node_routes: true
cilium_native_routing_cidr: "{{ kube_pods_subnet }}"
cilium_enable_bpf_masquerade: true
cilium_enable_host_legacy_routing: false
cilium_bpf_map_dynamic_size_ratio: "0.01"
cilium_enable_bandwidth_manager: true
cilium_enable_bandwidth_manager_bbr: false
cilium_cni_exclusive: false
cilium_monitor_aggregation: maximum
cilium_enable_hubble: false
cilium_enable_hubble_ui: false
cilium_hubble_install: false
cilium_extra_values:
  # Keep agent runtime configuration converged when the managed ConfigMap
  # changes; the upstream chart otherwise leaves existing agents untouched.
  rollOutCiliumPods: true
  # Big Bang emits ordinary Kubernetes NetworkPolicies for kube-apiserver
  # egress. The API servers are self-hosted on cluster nodes, so Cilium must
  # allow ipBlock selectors to match those node identities.
  policyCIDRMatchMode: nodes
  routingMode: native
  tunnelProtocol: ""
  socketLB:
    enabled: true
    hostNamespaceOnly: true
  bpf:
    distributedLRU:
      enabled: true
  bpfClockProbe: true
dns_min_replicas: 1
coredns_replicas: 1

# kubeadm's CreateJob upgrade check has a fixed 15-second deadline. On a busy
# control plane the Job can finish immediately after that deadline even though
# the scheduler, controller manager, and workload path are healthy. Keep all
# other preflight checks fatal; Atum's bounded pre/post upgrade health gates and
# the post-upgrade RBAC hook still fail closed around each sequential node.
kubeadm_ignore_preflight_errors:
  - CreateJob

post_upgrade_hooks:
  - "{{ inventory_dir }}/hooks/wait-admin-rbac.yml"

# Singleton workloads backed by local-path volumes cannot satisfy a
# zero-disruption PDB while their volume's node is cordoned. Give ordinary
# eviction time to move every portable workload, then use Kubespray's bounded
# fallback for the node-local remainder. The upgrade still fails closed if the
# fallback cannot drain the node.
drain_timeout: 180s
drain_retries: 1
drain_fallback_enabled: true
drain_fallback_timeout: 180s
drain_fallback_retries: 1
