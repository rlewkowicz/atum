---
- name: Project the Atum platform identity into Flux
  hosts: kube_control_plane
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Require the complete private identity projection
      ansible.builtin.assert:
        that:
          - atum_platform_identity is mapping
          - atum_platform_identity.ATUM_IDENTITY_SCHEMA_VERSION == "atum.dev/identity/v1"
          - atum_platform_identity.ATUM_IDENTITY_CLUSTER | length > 0
          - atum_platform_identity.ATUM_IDENTITY_DOMAIN | length > 0
          - >-
            atum_platform_identity.ATUM_IDENTITY_ISSUER ==
            "https://keycloak." + atum_platform_identity.ATUM_IDENTITY_DOMAIN + "/auth/realms/master"
          - atum_platform_identity.ATUM_IDENTITY_ADMIN_USERNAME == "atum"
          - atum_platform_identity.ATUM_IDENTITY_ADMIN_PASSWORD == "atum"
          - atum_platform_identity.ATUM_IDENTITY_ADMIN_GROUP == "atum-admins"
          - atum_platform_identity.ATUM_IDENTITY_BOOTSTRAP_PASSWORD | length >= 32
          - atum_platform_identity.ATUM_IDENTITY_DIGEST == atum_platform_identity_digest
          - atum_platform_identity_digest is match('^[0-9a-f]{64}$')
      no_log: true

    - name: Server-side apply the private Flux identity Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - apply
          - --server-side
          - --field-manager=atum-orchestration-identity
          - --filename=-
        stdin: >-
          {{ {
            'apiVersion': 'v1',
            'kind': 'Secret',
            'metadata': {
              'name': 'atum-platform-identity',
              'namespace': 'flux-system',
              'labels': {
                'reconcile.fluxcd.io/watch': 'Enabled'
              },
              'annotations': {
                'atum.dev/identity-digest': atum_platform_identity_digest
              }
            },
            'type': 'Opaque',
            'stringData': atum_platform_identity
          } | to_json }}
      register: atum_platform_identity_apply
      changed_when: >-
        'configured' in atum_platform_identity_apply.stdout or
        'created' in atum_platform_identity_apply.stdout
      no_log: true

    - name: Read the projected Flux identity metadata
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - secret
          - atum-platform-identity
          - --namespace=flux-system
          - --output=json
      register: atum_platform_identity_live
      changed_when: false
      no_log: true

    - name: Verify the projected key set and public digest
      ansible.builtin.assert:
        that:
          - >-
            ((atum_platform_identity_live.stdout | from_json).data.keys() | list | sort) ==
            (atum_platform_identity.keys() | list | sort)
          - >-
            (atum_platform_identity_live.stdout | from_json).metadata.annotations['atum.dev/identity-digest']
            == atum_platform_identity_digest
      no_log: true
