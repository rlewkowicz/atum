---
- name: Reconcile exact Kubernetes OIDC authentication
  hosts: kube_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Require the complete OIDC projection
      ansible.builtin.assert:
        that:
          - atum_platform_oidc is mapping
          - atum_platform_oidc.schemaVersion == "atum.dev/cluster-authentication/v1"
          - atum_platform_oidc.apiVersion == "v1"
          - >-
            atum_platform_oidc.authenticationPath ==
            "/etc/kubernetes/apiserver-authentication-config-" +
            atum_platform_oidc.apiVersion + ".yaml"
          - atum_platform_oidc.issuer is match('^https://keycloak\\.[a-z0-9.-]+/auth/realms/master$')
          - atum_platform_oidc.audiences == ["atum-headlamp", "atum-kiali"]
          - atum_platform_oidc.configDigest is match('^[0-9a-f]{64}$')
          - atum_platform_oidc.caFingerprint is match('^[0-9A-F]{64}$')
          - atum_platform_oidc.audienceDigest is match('^[0-9a-f]{64}$')
          - atum_platform_oidc.config | hash('sha256') == atum_platform_oidc.configDigest
          - (atum_platform_oidc.config | from_yaml).apiVersion == "apiserver.config.k8s.io/" + atum_platform_oidc.apiVersion
          - (atum_platform_oidc.config | from_yaml).kind == "AuthenticationConfiguration"
          - (atum_platform_oidc.config | from_yaml).jwt | length == 1
          - (atum_platform_oidc.config | from_yaml).jwt[0].issuer.url == atum_platform_oidc.issuer
          - (atum_platform_oidc.config | from_yaml).jwt[0].issuer.audiences == atum_platform_oidc.audiences
          - (atum_platform_oidc.config | from_yaml).jwt[0].issuer.audienceMatchPolicy == "MatchAny"
          - (atum_platform_oidc.config | from_yaml).jwt[0].issuer.certificateAuthority | length > 0
          - (atum_platform_oidc.config | from_yaml).jwt[0].claimMappings.username.claim == "preferred_username"
          - (atum_platform_oidc.config | from_yaml).jwt[0].claimMappings.username.prefix == "oidc:"
          - (atum_platform_oidc.config | from_yaml).jwt[0].claimMappings.groups.claim == "groups"
          - (atum_platform_oidc.config | from_yaml).jwt[0].claimMappings.groups.prefix == "oidc:"
          - (atum_platform_oidc.config | from_yaml).anonymous.enabled
          - (atum_platform_oidc.config | from_yaml).anonymous.conditions | length == 0

    - name: Require Kubespray's mounted authentication file
      ansible.builtin.stat:
        path: "{{ atum_platform_oidc.authenticationPath }}"
      register: atum_platform_oidc_existing

    - name: Verify Kubespray relinquished one valid file
      ansible.builtin.assert:
        that:
          - atum_platform_oidc_existing.stat.exists
          - atum_platform_oidc_existing.stat.isreg

    - name: Atomically install the exact authentication configuration
      ansible.builtin.copy:
        content: "{{ atum_platform_oidc.config }}"
        dest: "{{ atum_platform_oidc.authenticationPath }}"
        owner: root
        group: root
        mode: "0640"

    - name: Wait for this API server to remain healthy
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --server=https://127.0.0.1:6443
          - --tls-server-name=kubernetes
          - get
          - --raw=/readyz
      register: atum_platform_oidc_health
      until: atum_platform_oidc_health.rc == 0 and atum_platform_oidc_health.stdout == "ok"
      retries: 36
      delay: 5
      changed_when: false

    - name: Wait for this API server to load the exact configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --server=https://127.0.0.1:6443
          - --tls-server-name=kubernetes
          - get
          - --raw=/metrics
      register: atum_platform_oidc_metrics
      until: >-
        atum_platform_oidc_metrics.rc == 0 and
        (
          'apiserver_authentication_config_controller_last_config_info' in
          atum_platform_oidc_metrics.stdout
        ) and
        atum_platform_oidc.configDigest in atum_platform_oidc_metrics.stdout
      retries: 36
      delay: 5
      changed_when: false

    - name: Prove this administrator is authenticated and authorized
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --server=https://127.0.0.1:6443
          - --tls-server-name=kubernetes
          - auth
          - can-i
          - "*"
          - "*"
          - --all-namespaces
          - --quiet
      register: atum_platform_oidc_authorization
      until: atum_platform_oidc_authorization.rc == 0
      retries: 36
      delay: 5
      changed_when: false

    - name: Retain the verified node digest
      ansible.builtin.set_fact:
        atum_platform_oidc_verified_digest: "{{ atum_platform_oidc.configDigest }}"

- name: Publish the exact Kubernetes OIDC receipt
  hosts: kube_control_plane
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Verify every control plane loaded one digest
      ansible.builtin.assert:
        that:
          - >-
            groups['kube_control_plane'] |
            map('extract', hostvars, 'atum_platform_oidc_verified_digest') |
            unique | list == [atum_platform_oidc.configDigest]

    - name: Server-side apply the non-secret authentication receipt
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - apply
          - --server-side
          - --field-manager=atum-orchestration-oidc
          - --filename=-
        stdin: >-
          {{ {
            'apiVersion': 'v1',
            'kind': 'ConfigMap',
            'metadata': {
              'name': 'atum-authentication',
              'namespace': 'kube-system'
            },
            'data': {
              'schemaVersion': atum_platform_oidc.schemaVersion,
              'issuer': atum_platform_oidc.issuer,
              'configDigest': atum_platform_oidc.configDigest,
              'caFingerprint': atum_platform_oidc.caFingerprint,
              'audienceDigest': atum_platform_oidc.audienceDigest,
              'verifiedNodes': groups['kube_control_plane'] | length | string
            }
          } | to_json }}
      register: atum_platform_oidc_receipt_apply
      changed_when: >-
        'configured' in atum_platform_oidc_receipt_apply.stdout or
        'created' in atum_platform_oidc_receipt_apply.stdout

    - name: Read the reconciled authentication receipt
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - configmap
          - atum-authentication
          - --namespace=kube-system
          - --output=json
      register: atum_platform_oidc_receipt_live
      changed_when: false

    - name: Verify the exact receipt
      ansible.builtin.assert:
        that:
          - >-
            (atum_platform_oidc_receipt_live.stdout | from_json).data ==
            {
              'schemaVersion': atum_platform_oidc.schemaVersion,
              'issuer': atum_platform_oidc.issuer,
              'configDigest': atum_platform_oidc.configDigest,
              'caFingerprint': atum_platform_oidc.caFingerprint,
              'audienceDigest': atum_platform_oidc.audienceDigest,
              'verifiedNodes': groups['kube_control_plane'] | length | string
            }
