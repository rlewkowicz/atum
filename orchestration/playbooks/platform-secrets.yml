---
- name: Project the Flux SOPS decryption credential
  hosts: kube_control_plane
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Require the private Flux SOPS projection
      ansible.builtin.assert:
        that:
          - atum_flux_sops_keys is mapping
          - >-
            (atum_flux_sops_keys.keys() | list | sort) ==
            (['identity.agekey'] | sort)
          - atum_flux_sops_keys['identity.agekey'] is match('^AGE-SECRET-KEY-1[A-Z0-9]+\\n?$')
          - atum_flux_sops_recipient is match('^age1[0-9a-z]+$')
      no_log: true

    - name: Server-side apply the Flux SOPS decryption Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - apply
          - --server-side
          - --field-manager=atum-flux-sops
          - --filename=-
        stdin: >-
          {{ {
            'apiVersion': 'v1',
            'kind': 'Secret',
            'metadata': {
              'name': 'atum-sops-age',
              'namespace': 'flux-system',
              'labels': {
                'reconcile.fluxcd.io/watch': 'Enabled'
              },
              'annotations': {
                'atum.dev/age-recipient': atum_flux_sops_recipient
              }
            },
            'type': 'Opaque',
            'stringData': atum_flux_sops_keys
          } | to_json }}
      register: atum_flux_sops_apply
      changed_when: >-
        'configured' in atum_flux_sops_apply.stdout or
        'created' in atum_flux_sops_apply.stdout
      no_log: true

    - name: Read the Flux SOPS decryption Secret metadata
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - secret
          - atum-sops-age
          - --namespace=flux-system
          - --output=json
      register: atum_flux_sops_live
      changed_when: false
      no_log: true

    - name: Verify the decryption key set and public recipient
      ansible.builtin.assert:
        that:
          - >-
            ((atum_flux_sops_live.stdout | from_json).data.keys() | list | sort) ==
            (atum_flux_sops_keys.keys() | list | sort)
          - >-
            (atum_flux_sops_live.stdout | from_json).metadata.annotations['atum.dev/age-recipient']
            == atum_flux_sops_recipient
      no_log: true
