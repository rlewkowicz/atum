apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: atum-sso-ca
  namespace: vault
spec:
  commonName: sso-ca.vault
  dnsNames:
    - sso-ca.vault
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: atum-test-ca
  secretName: atum-sso-ca
