apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security-config
  namespace: opensearch
  annotations:
    atum.dev/stateful-digest: ${ATUM_STATEFUL_DIGEST}
type: Opaque
immutable: true
stringData:
  action_groups.yml: |
    _meta:
      type: actiongroups
      config_version: 2
  config.yml: |
    _meta:
      type: config
      config_version: 2
    config:
      dynamic:
        http:
          anonymous_auth_enabled: false
        authc:
          basic_internal_auth_domain:
            description: HTTP basic authentication backed by internal users
            http_enabled: true
            transport_enabled: true
            order: 0
            http_authenticator:
              type: basic
              challenge: true
            authentication_backend:
              type: intern
  internal_users.yml: |
    _meta:
      type: internalusers
      config_version: 2
    admin:
      hash: "${ATUM_STATEFUL_OPENSEARCH_ADMIN_HASH}"
      reserved: true
      backend_roles:
        - admin
    kibanaserver:
      hash: "${ATUM_STATEFUL_OPENSEARCH_DASHBOARDS_HASH}"
      reserved: true
    fluentbit:
      hash: "${ATUM_STATEFUL_FLUENTBIT_OPENSEARCH_HASH}"
      reserved: true
      backend_roles:
        - fluentbit_writer
  roles.yml: |
    _meta:
      type: roles
      config_version: 2
    fluentbit_writer:
      cluster_permissions:
        - cluster_composite_ops
      index_permissions:
        - index_patterns:
            - kubernetes-*
            - node-*
          allowed_actions:
            - create_index
            - crud
  roles_mapping.yml: |
    _meta:
      type: rolesmapping
      config_version: 2
    all_access:
      reserved: true
      backend_roles:
        - admin
    kibana_server:
      reserved: true
      users:
        - kibanaserver
    fluentbit_writer:
      reserved: true
      backend_roles:
        - fluentbit_writer
  tenants.yml: |
    _meta:
      type: tenants
      config_version: 2
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-admin-credentials
  namespace: opensearch
  annotations:
    atum.dev/stateful-digest: ${ATUM_STATEFUL_DIGEST}
type: kubernetes.io/basic-auth
immutable: true
stringData:
  username: admin
  password: ${ATUM_STATEFUL_OPENSEARCH_ADMIN_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-dashboards-credentials
  namespace: opensearch
  annotations:
    atum.dev/stateful-digest: ${ATUM_STATEFUL_DIGEST}
type: Opaque
immutable: true
stringData:
  username: kibanaserver
  password: ${ATUM_STATEFUL_OPENSEARCH_DASHBOARDS_PASSWORD}
  cookie: ${ATUM_STATEFUL_OPENSEARCH_DASHBOARDS_COOKIE}
---
apiVersion: v1
kind: Secret
metadata:
  name: fluentbit-opensearch-credentials
  namespace: fluentbit
  annotations:
    atum.dev/stateful-digest: ${ATUM_STATEFUL_DIGEST}
type: Opaque
immutable: true
stringData:
  OPENSEARCH_USER: fluentbit
  OPENSEARCH_PASSWORD: ${ATUM_STATEFUL_FLUENTBIT_OPENSEARCH_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-dashboards-ca
  namespace: opensearch
  annotations:
    atum.dev/root-ca-digest: ${ATUM_ROOT_CA_DIGEST}
type: Opaque
immutable: true
data:
  ca.crt: ${ATUM_ROOT_CA_CERTIFICATE_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: fluentbit-opensearch-ca
  namespace: fluentbit
  annotations:
    atum.dev/root-ca-digest: ${ATUM_ROOT_CA_DIGEST}
type: Opaque
immutable: true
data:
  ca.crt: ${ATUM_ROOT_CA_CERTIFICATE_B64}
