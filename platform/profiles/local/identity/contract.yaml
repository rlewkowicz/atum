schemaVersion: atum.dev/identity/v1
realm: master
issuer: https://keycloak.atum.test/auth/realms/master
scopes:
  - openid
  - profile
  - email
  - groups
groupClaim: groups
administrator:
  username: atum
  group: atum-admins
  serverRole: admin
additionalEndpoints:
  - id: keycloak
    host: keycloak.atum.test
    category: identity
    access: browser
  - id: gitlab-kas
    host: kas.atum.test
    category: development
    access: token
  - id: gitlab-registry
    host: registry.atum.test
    category: development
    access: token
clients:
  - id: atum-headlamp
    application: headlamp
    type: public-pkce
    host: headlamp.atum.test
    category: development
    integration: native-oidc
    callbacks:
      - https://headlamp.atum.test/oidc-callback
    administratorMapping: oidc:atum-admins=cluster-admin
    audience: true
  - id: atum-kiali
    application: kiali
    type: confidential
    host: kiali.atum.test
    category: observability
    integration: native-oidc
    secretPurpose: kiali
    callbacks:
      - https://kiali.atum.test/kiali
    administratorMapping: authenticated-cluster-admin
    audience: true
  - id: atum-grafana
    application: grafana
    type: confidential
    host: grafana.atum.test
    category: observability
    integration: native-oidc
    secretPurpose: grafana
    callbacks:
      - https://grafana.atum.test/login/generic_oauth
    administratorMapping: Admin
  - id: atum-gitlab
    application: gitlab
    type: confidential
    host: gitlab.atum.test
    category: development
    integration: native-oidc
    secretPurpose: gitlab
    callbacks:
      - https://gitlab.atum.test/users/auth/openid_connect/callback
    administratorMapping: adminGroups
  - id: atum-policy-reporter
    application: policy-reporter
    type: confidential
    host: policy.atum.test
    category: observability
    integration: native-oidc
    secretPurpose: policy-reporter
    callbacks:
      - https://policy.atum.test/callback
    administratorMapping: authenticated-ui-admin
  - id: atum-harbor
    application: harbor
    type: confidential
    host: harbor.atum.test
    category: development
    integration: native-oidc
    secretPurpose: harbor
    callbacks:
      - https://harbor.atum.test/c/oidc/callback
    administratorMapping: oidc-admin-group
  - id: atum-vault
    application: vault
    type: confidential
    host: vault.atum.test
    category: identity
    integration: flux-reconciliation
    secretPurpose: vault
    callbacks:
      - https://vault.atum.test/ui/vault/auth/oidc/oidc/callback
    administratorMapping: administrator-policy
  - id: atum-prometheus
    application: prometheus
    type: confidential
    host: prometheus.atum.test
    category: observability
    integration: authservice
    secretPurpose: prometheus
    callbacks:
      - https://prometheus.atum.test/oauth2/callback
    administratorMapping: authenticated
  - id: atum-alertmanager
    application: alertmanager
    type: confidential
    host: alertmanager.atum.test
    category: observability
    integration: authservice
    secretPurpose: alertmanager
    callbacks:
      - https://alertmanager.atum.test/oauth2/callback
    administratorMapping: authenticated
  - id: atum-opensearch
    application: opensearch
    type: confidential
    host: opensearch.atum.test
    category: observability
    integration: authservice
    secretPurpose: opensearch
    callbacks:
      - https://opensearch.atum.test/oauth2/callback
    administratorMapping: authenticated
