              "$KCADM" get clients/"$client_id"/default-client-scopes -r master --fields name \
                --config "$CONFIG" | grep -F '"name" : "email"' >/dev/null
              audience_ids=$("$KCADM" get clients/"$client_id"/protocol-mappers/models -r master \
                --fields id,name --format csv --noquotes --config "$CONFIG" |
                sed -n '/,atum-audience$/s/,.*//p')
              audience_id="$(printf '%s\n' "$audience_ids" | head -1)"
              for audience_id in $audience_ids; do
                "$KCADM" delete clients/"$client_id"/protocol-mappers/models/"$audience_id" \
                  -r master --config "$CONFIG" >/dev/null
              done
              [ "$("$KCADM" get clients/"$client_id"/protocol-mappers/models -r master \
                --fields id,name --format csv --noquotes --config "$CONFIG" |
                grep -c ',atum-audience$' || true)" -eq 0 ]
              verified=$("$KCADM" get clients/"$client_id" -r master --fields clientId,publicClient,redirectUris,webOrigins,attributes --config "$CONFIG")
              printf '%s' "$verified" | grep -F '"clientId" : "atum-opensearch"' >/dev/null
              printf '%s' "$verified" | grep -F '"publicClient" : false' >/dev/null
              "$KCADM" get clients/"$client_id"/default-client-scopes -r master --fields name --config "$CONFIG" |
                grep -F '"name" : "atum-groups"' >/dev/null
              printf '%s' "$verified" | grep -F 'https://opensearch.atum.test/oauth2/callback' >/dev/null
              printf '%s' "$verified" | grep -F 'https://opensearch.atum.test' >/dev/null
              login "$ADMIN_USERNAME" "$ADMIN_PASSWORD"
              bootstrap_id=$("$KCADM" get users -r master -q username=atum-bootstrap --fields id --config "$CONFIG" |
                sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | head -1)
              if [ -n "$bootstrap_id" ]; then
                "$KCADM" delete users/"$bootstrap_id" -r master --config "$CONFIG"
              fi
              login "$ADMIN_USERNAME" "$ADMIN_PASSWORD"
              verified_user=$("$KCADM" get users/"$user_id" -r master \
                --fields username,email,emailVerified,enabled --config "$CONFIG")
              printf '%s' "$verified_user" | grep -F '"username" : "'"$ADMIN_USERNAME"'"' >/dev/null
              printf '%s' "$verified_user" | grep -F '"email" : "'"$ADMIN_EMAIL"'"' >/dev/null
              printf '%s' "$verified_user" | grep -F '"emailVerified" : true' >/dev/null
              printf '%s' "$verified_user" | grep -F '"enabled" : true' >/dev/null
              "$KCADM" get users/"$user_id"/groups -r master --fields id,name --config "$CONFIG" |
                grep -F '"name" : "'"$ADMIN_GROUP"'"' >/dev/null
              "$KCADM" get users/"$user_id"/role-mappings/clients/"$management_id" -r master --config "$CONFIG" |
                grep -F '"name" : "realm-admin"' >/dev/null
          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: password
            - name: ADMIN_GROUP
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: group
            - name: BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: bootstrap-password
            - name: ATUM_KIALI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-kiali
            - name: ATUM_GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-grafana
            - name: ATUM_GITLAB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-gitlab
            - name: ATUM_POLICY_REPORTER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-policy-reporter
            - name: ATUM_HARBOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-harbor
            - name: ATUM_VAULT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-vault
            - name: ATUM_PROMETHEUS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-prometheus
            - name: ATUM_ALERTMANAGER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-alertmanager
            - name: ATUM_OPENSEARCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-keycloak-reconcile
                  key: atum-opensearch
          volumeMounts:
            - name: ca
              mountPath: /var/run/atum-ca
              readOnly: true
            - name: kcadm
              mountPath: /var/run/atum-kcadm
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: ca
          secret:
            secretName: atum-sso-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: kcadm
          emptyDir:
            sizeLimit: 8Mi
