apiVersion: v1
kind: Secret
metadata:
  name: atum-keycloak-reconcile
  namespace: keycloak
  annotations:
    atum.dev/identity-digest: ${ATUM_IDENTITY_DIGEST}
type: Opaque
stringData:
  username: ${ATUM_IDENTITY_ADMIN_USERNAME}
  password: ${ATUM_IDENTITY_ADMIN_PASSWORD}
  group: ${ATUM_IDENTITY_ADMIN_GROUP}
  bootstrap-password: ${ATUM_IDENTITY_BOOTSTRAP_PASSWORD}
  atum-kiali: ${ATUM_KIALI_CLIENT_SECRET}
  atum-grafana: ${ATUM_GRAFANA_CLIENT_SECRET}
  atum-gitlab: ${ATUM_GITLAB_CLIENT_SECRET}
  atum-policy-reporter: ${ATUM_POLICY_REPORTER_CLIENT_SECRET}
  atum-harbor: ${ATUM_HARBOR_CLIENT_SECRET}
  atum-openbao: ${ATUM_OPENBAO_CLIENT_SECRET}
  atum-prometheus: ${ATUM_PROMETHEUS_CLIENT_SECRET}
  atum-alertmanager: ${ATUM_ALERTMANAGER_CLIENT_SECRET}
  atum-opensearch: ${ATUM_OPENSEARCH_CLIENT_SECRET}
---
apiVersion: v1
kind: Secret
metadata:
  name: atum-openbao-reconcile
  namespace: vault
  annotations:
    atum.dev/identity-digest: ${ATUM_IDENTITY_DIGEST}
type: Opaque
stringData:
  client-id: atum-openbao
  client-secret: ${ATUM_OPENBAO_CLIENT_SECRET}
  group: ${ATUM_IDENTITY_ADMIN_GROUP}
