apiVersion: batch/v1
kind: Job
metadata:
  name: atum-openbao-reconcile
  namespace: vault
  labels:
    atum.dev/identity-job: openbao
  annotations:
    atum.dev/identity-digest: ${ATUM_IDENTITY_DIGEST}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atum-openbao-reconcile
        atum.dev/identity-job: openbao
      annotations:
        atum.dev/identity-digest: ${ATUM_IDENTITY_DIGEST}
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: 10.77.0.9:32443/atum/openbao:2.5.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              trap 'curl -fsS -X POST http://127.0.0.1:15020/quitquitquit >/dev/null 2>&1 || true' EXIT
              until bao status >/dev/null 2>&1; do sleep 5; done
              list_ids() {
                bao list -format=json "$1" 2>/dev/null |
                  sed -n 's/.*"keys":[[]\([^]]*\)[]].*/\1/p' | tr -d '"' | tr ',' ' '
              }
              if ! bao auth list -format=json | grep -F '"oidc/"' >/dev/null; then
                bao auth enable -path=oidc oidc >/dev/null
              fi
              bao write auth/oidc/config \
                oidc_discovery_url='https://keycloak.atum.test/auth/realms/master' \
                oidc_discovery_ca=@/var/run/atum-ca/ca.crt \
                oidc_client_id="$OIDC_CLIENT_ID" \
                oidc_client_secret="$OIDC_CLIENT_SECRET" \
                default_role=atum-admin >/dev/null
              bao policy write atum-admin - >/dev/null <<'POLICY'
              path "*" {
                capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
              }
              POLICY
              bao write auth/oidc/role/atum-admin \
                bound_audiences="$OIDC_CLIENT_ID" \
                allowed_redirect_uris='https://vault.atum.test/ui/vault/auth/oidc/oidc/callback' \
                user_claim=preferred_username \
                groups_claim='groups' \
                oidc_scopes='openid,profile,email,groups' \
                policies=atum-admin >/dev/null
              accessor=$(bao auth list -format=json |
                sed -n '/"oidc\\/"/,/}/s/.*"accessor": *"\([^"]*\)".*/\1/p' | head -1)
              [ -n "$accessor" ]
              group_id=$(
                for id in $(list_ids identity/group/id); do
                  [ -n "$id" ] || continue
                  [ "$(bao read -field=name identity/group/id/"$id" 2>/dev/null || true)" = "$ADMIN_GROUP" ] && {
                    printf '%s' "$id"
                    break
                  }
                done)
              if [ -z "$group_id" ]; then
                group_id=$(bao write -field=id identity/group name="$ADMIN_GROUP" type=external policies=atum-admin)
              else
                bao write identity/group/id/"$group_id" name="$ADMIN_GROUP" type=external policies=atum-admin >/dev/null
              fi
              alias_id=$(
                for id in $(list_ids identity/group-alias/id); do
                  [ -n "$id" ] || continue
                  name=$(bao read -field=name identity/group-alias/id/"$id" 2>/dev/null || true)
                  mount=$(bao read -field=mount_accessor identity/group-alias/id/"$id" 2>/dev/null || true)
                  [ "$name" = "$ADMIN_GROUP" ] && [ "$mount" = "$accessor" ] && {
                    printf '%s' "$id"
                    break
                  }
                done)
              if [ -z "$alias_id" ]; then
                bao write identity/group-alias name="$ADMIN_GROUP" mount_accessor="$accessor" \
                  canonical_id="$group_id" >/dev/null
              else
                bao write identity/group-alias/id/"$alias_id" name="$ADMIN_GROUP" mount_accessor="$accessor" \
                  canonical_id="$group_id" >/dev/null
              fi
              [ "$(bao read -field=policies identity/group/id/"$group_id" | tr -d '[]')" = "atum-admin" ]
              [ "$(bao read -field=oidc_discovery_url auth/oidc/config)" = 'https://keycloak.atum.test/auth/realms/master' ]
              [ "$(bao read -field=oidc_client_id auth/oidc/config)" = "$OIDC_CLIENT_ID" ]
              bao read -format=json auth/oidc/role/atum-admin | grep -F 'https://vault.atum.test/ui/vault/auth/oidc/oidc/callback' >/dev/null
              [ "$(bao read -field=user_claim auth/oidc/role/atum-admin)" = "preferred_username" ]
              [ "$(bao read -field=groups_claim auth/oidc/role/atum-admin)" = "groups" ]
          env:
            - name: BAO_ADDR
              value: http://vault-vault.vault.svc:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-token
                  key: key
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atum-openbao-reconcile
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atum-openbao-reconcile
                  key: client-secret
            - name: ADMIN_GROUP
              valueFrom:
                secretKeyRef:
                  name: atum-openbao-reconcile
                  key: group
          volumeMounts:
            - name: ca
              mountPath: /var/run/atum-ca
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: ca
          secret:
            secretName: atum-sso-ca
            items:
              - key: ca.crt
                path: ca.crt
