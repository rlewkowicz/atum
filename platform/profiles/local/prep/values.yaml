domain: ${ATUM_PLATFORM_DOMAIN}
networkPolicies:
  # Big Bang's documented API destination is the endpoint set reported by the
  # kubernetes Service, not the HAProxy VIP. This is the smallest CIDR
  # containing all three local endpoints: .11, .12, and .13.
  controlPlaneCidr: 10.77.0.8/29
  ingress:
    definitions:
      controlPlaneWebhooks:
        from:
          - ipBlock:
              cidr: 10.77.0.11/32
          - ipBlock:
              cidr: 10.77.0.12/32
          - ipBlock:
              cidr: 10.77.0.13/32
kyvernoPolicies:
  values:
    policies:
      restrict-image-registries:
        skipOverlayMerge: true
        parameters:
          allow:
            - 10.77.0.9:32443
      # The local-path provisioner is the sole owner of node-local hostPath
      # volumes. Its short-lived helper pods need write access to the exact
      # storage root, and the generated PVs remain constrained to that root.
      restrict-host-path-mount:
        parameters:
          allow:
            - /var/lib/atum/local-path-provisioner/*
      restrict-host-path-mount-pv:
        parameters:
          allow:
            - /var/lib/atum/local-path-provisioner/*
      restrict-host-path-write:
        parameters:
          allow:
            - /var/lib/atum/local-path-provisioner/*
      # The upstream helper owns setup and teardown beneath its node hostPath.
      # It must retain the image's root identity to create directories in the
      # root-owned base path; every other selected policy remains enforced.
      add-default-securitycontext:
        exclude:
          any:
            - resources:
                namespaces:
                  - local-path-storage
                names:
                  - helper-pod-*
      require-non-root-user:
        exclude:
          any:
            - resources:
                namespaces:
                  - local-path-storage
                names:
                  - helper-pod-*
      require-non-root-group:
        exclude:
          any:
            - resources:
                namespaces:
                  - local-path-storage
                names:
                  - helper-pod-*
      restrict-volume-types:
        exclude:
          any:
            - resources:
                namespaces:
                  - local-path-storage
                names:
                  - helper-pod-*
istiod:
  values:
    networkPolicies:
      ingress:
        to:
          istiod:[443,15017]:
            from:
              # Cilium's node-aware CIDR mode excludes control-plane node
              # identities from a world CIDR. Use Big Bang's canonical
              # controlPlaneWebhooks definition for webhook traffic.
              cidr:
                0.0.0.0/0: false
              definition:
                controlPlaneWebhooks: true
    upstream:
      pilot:
        autoscaleEnabled: false
        replicaCount: 1
kiali:
  values:
    upstream:
      cr:
        spec:
          deployment:
            replicas: 1
kyverno:
  values:
    upstream:
      admissionController:
        replicas: 1
      backgroundController:
        replicas: 1
      cleanupController:
        replicas: 1
      reportsController:
        replicas: 1
kyvernoReporter:
  values:
    upstream:
      replicaCount: 1
      ui:
        replicaCount: 1
      plugin:
        kyverno:
          replicaCount: 1
tempo:
  values:
    upstream:
      replicas: 1
monitoring:
  values:
    networkPolicies:
      ingress:
        to:
          kube-prometheus-stack-prometheus-operator:10250:
            from:
              cidr:
                10.77.0.8/29: false
              definition:
                controlPlaneWebhooks: true
    upstream:
      alertmanager:
        alertmanagerSpec:
          replicas: 1
      prometheus:
        prometheusSpec:
          replicas: 1
grafana:
  values:
    upstream:
      replicas: 1
      autoscaling:
        enabled: false
addons:
  metricsServer:
    values:
      upstream:
        # Kubespray's kubelets use per-node self-signed serving certificates.
        # The local profile constrains this traffic to cluster nodes rather
        # than installing a second, non-Flux CSR reconciliation controller.
        args:
          - --kubelet-insecure-tls
  gitlab:
    values:
      upstream:
        registry:
          hpa:
            minReplicas: 1
            maxReplicas: 1
        gitlab:
          toolbox:
            replicas: 1
          webservice:
            minReplicas: 1
            maxReplicas: 1
          sidekiq:
            minReplicas: 1
            maxReplicas: 1
          gitlab-shell:
            minReplicas: 1
            maxReplicas: 1
  keycloak:
    values:
      upstream:
        http:
          internalScheme: HTTPS
        extraEnv: |
          - name: KC_HTTPS_CLIENT_AUTH
            value: request
          - name: KC_TRUSTSTORE_PATHS
            value: /etc/ssl/certs/
          - name: KC_HOSTNAME
            value: keycloak.${ATUM_PLATFORM_DOMAIN}
          - name: KC_HOSTNAME_STRICT
            value: "true"
          - name: KC_HTTPS_CERTIFICATE_FILE
            value: /opt/keycloak/conf/atum-tls/tls.crt
          - name: KC_HTTPS_CERTIFICATE_KEY_FILE
            value: /opt/keycloak/conf/atum-tls/tls.key
        extraVolumes: |
          - name: keycloak-tls
            secret:
              secretName: keycloak-tls
        extraVolumeMounts: |
          - name: keycloak-tls
            mountPath: /opt/keycloak/conf/atum-tls
            readOnly: true
  vault:
    values:
      networkPolicies:
        egress:
          definitions:
            # Big Bang 3.31.1's deprecated vpcCidr migration otherwise
            # broadens kubeAPI egress when vpcCidr is intentionally absent.
            kubeAPI:
              to:
                - ipBlock:
                    cidr: 10.77.0.8/29
        ingress:
          to:
            vault-agent-injector:8080:
              from:
                cidr:
                  0.0.0.0/0: false
                definition:
                  controlPlaneWebhooks: true
      upstream:
        server:
          ha:
            apiAddr: https://vault.${ATUM_PLATFORM_DOMAIN}
istioGateway:
  values:
    gateways:
      public:
        networkPolicies:
          ingress:
            to:
              "public-ingressgateway:[8080,8443]":
                from:
                  # Cilium preserves the source pod identity after translating
                  # the public LoadBalancer VIP to this gateway. Big Bang's
                  # RFC1918 ipBlocks therefore admit external clients but not
                  # in-cluster clients of the same public HTTPS endpoints.
                  k8s:
                    "*": true
        upstream:
          service:
            type: LoadBalancer
            annotations:
              kube-vip.io/loadbalancerIPs: "10.77.0.20"
      passthrough:
        upstream:
          service:
            type: LoadBalancer
            annotations:
              kube-vip.io/loadbalancerIPs: "10.77.0.21"
packages:
  postgresql:
    values:
      cluster:
        instances: 1
        storage:
          size: 8Gi
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
  redis:
    values:
      upstream:
        master:
          persistence:
            enabled: true
            size: 256Mi
  garage:
    values:
      garageInit:
        capacityBytes: "10000000000"
      upstream:
        deployment:
          replicaCount: 1
        garage:
          replicationFactor: "1"
        persistence:
          enabled: true
          meta:
            size: 1Gi
          data:
            size: 10Gi
  opensearch:
    values:
      # Local single-node storage cannot satisfy the upstream multi-node
      # topology. Native OpenSearch authentication and TLS remain enabled.
      singleNode: true
      replicas: 1
      extraEnvs:
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
      persistence:
        enableInitChown: false
      sysctlInit:
        enabled: false
  opensearch-dashboards:
    values:
      replicaCount: 1
      autoscaling:
        enabled: false
