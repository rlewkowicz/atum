domain: ${ATUM_PLATFORM_DOMAIN}
networkPolicies:
  # The local profile owns the control-plane network once. Big Bang packages
  # use it for API egress, while webhook packages consume the reusable kubeAPI
  # ingress definition.
  controlPlaneCidr: &kubeAPICIDR 10.77.0.8/29
  # Big Bang uses the VPC CIDR alongside the control-plane CIDR when
  # generating Vault's reusable kubeAPI egress definition.
  vpcCidr: 10.77.0.0/24
  ingress:
    definitions:
      kubeAPI:
        from:
          - ipBlock:
              cidr: *kubeAPICIDR
kyvernoPolicies:
  values:
    policies:
      restrict-image-registries:
        skipOverlayMerge: true
        parameters:
          allow:
            - 10.77.0.9:32443
istiod:
  values:
    upstream:
      pilot:
        autoscaleEnabled: false
        replicaCount: 1
kiali:
  values:
    upstream:
      cr:
        spec:
          deployment:
            replicas: 1
kyverno:
  values:
    upstream:
      admissionController:
        replicas: 1
      backgroundController:
        replicas: 1
      cleanupController:
        replicas: 1
      reportsController:
        replicas: 1
kyvernoReporter:
  values:
    upstream:
      replicaCount: 1
      ui:
        replicaCount: 1
      plugin:
        kyverno:
          replicaCount: 1
tempo:
  values:
    upstream:
      replicas: 1
monitoring:
  values:
    upstream:
      alertmanager:
        alertmanagerSpec:
          replicas: 1
      prometheus:
        prometheusSpec:
          replicas: 1
grafana:
  values:
    upstream:
      replicas: 1
      autoscaling:
        enabled: false
addons:
  gitlab:
    values:
      upstream:
        registry:
          hpa:
            minReplicas: 1
            maxReplicas: 1
        gitlab:
          toolbox:
            replicas: 1
          webservice:
            minReplicas: 1
            maxReplicas: 1
          sidekiq:
            minReplicas: 1
            maxReplicas: 1
          gitlab-shell:
            minReplicas: 1
            maxReplicas: 1
  keycloak:
    values:
      upstream:
        http:
          internalScheme: HTTPS
        extraEnv: |
          - name: KC_HTTPS_CLIENT_AUTH
            value: request
          - name: KC_TRUSTSTORE_PATHS
            value: /etc/ssl/certs/
          - name: KC_HOSTNAME
            value: keycloak.${ATUM_PLATFORM_DOMAIN}
          - name: KC_HOSTNAME_STRICT
            value: "true"
          - name: KC_HTTPS_CERTIFICATE_FILE
            value: /opt/keycloak/conf/atum-tls/tls.crt
          - name: KC_HTTPS_CERTIFICATE_KEY_FILE
            value: /opt/keycloak/conf/atum-tls/tls.key
        extraVolumes: |
          - name: keycloak-tls
            secret:
              secretName: keycloak-tls
        extraVolumeMounts: |
          - name: keycloak-tls
            mountPath: /opt/keycloak/conf/atum-tls
            readOnly: true
  vault:
    values:
      upstream:
        server:
          ha:
            apiAddr: https://vault.${ATUM_PLATFORM_DOMAIN}
istioGateway:
  values:
    gateways:
      public:
        upstream:
          service:
            type: LoadBalancer
            annotations:
              kube-vip.io/loadbalancerIPs: "10.77.0.20"
      passthrough:
        upstream:
          service:
            type: LoadBalancer
            annotations:
              kube-vip.io/loadbalancerIPs: "10.77.0.21"
packages:
  postgresql:
    values:
      cluster:
        instances: 1
        storage:
          size: 8Gi
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
  redis:
    values:
      upstream:
        master:
          persistence:
            enabled: true
            size: 256Mi
  garage:
    values:
      garageInit:
        capacityBytes: "10000000000"
      upstream:
        deployment:
          replicaCount: 1
        garage:
          replicationFactor: "1"
        persistence:
          enabled: true
          meta:
            size: 1Gi
          data:
            size: 10Gi
