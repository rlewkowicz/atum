apiVersion: v1
kind: Secret
metadata:
  name: atum-platform-identity-values
  namespace: bigbang
  labels:
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    atum.dev/identity-digest: ${ATUM_IDENTITY_DIGEST}
type: Opaque
stringData:
  values.yaml: |
    addons:
        authservice:
            chains:
                alertmanager:
                    callback_uri: https://alertmanager.atum.test/oauth2/callback
                    client_id: atum-alertmanager
                    client_secret: ${ATUM_ALERTMANAGER_CLIENT_SECRET}
                    match:
                        header: :authority
                        prefix: alertmanager.atum.test
                local: null
                opensearch:
                    callback_uri: https://opensearch.atum.test/oauth2/callback
                    client_id: atum-opensearch
                    client_secret: ${ATUM_OPENSEARCH_CLIENT_SECRET}
                    match:
                        header: :authority
                        prefix: opensearch.atum.test
                prometheus:
                    callback_uri: https://prometheus.atum.test/oauth2/callback
                    client_id: atum-prometheus
                    client_secret: ${ATUM_PROMETHEUS_CLIENT_SECRET}
                    match:
                        header: :authority
                        prefix: prometheus.atum.test
        gitlab:
            sso:
                client_id: atum-gitlab
                client_secret: ${ATUM_GITLAB_CLIENT_SECRET}
                enabled: true
                groups:
                    adminGroups:
                        - atum-admins
                    groupsAttribute: groups
                    requiredGroups: []
                scopes:
                    - openid
                    - profile
                    - email
                    - groups
            values:
                global:
                    certificates:
                        customCAs:
                            - keys:
                                - ca.crt
                              secret: atum-sso-root-ca
                routes:
                    outbound:
                        sso:
                            resolution: NONE
        harbor:
            values:
                networkPolicies:
                    egress:
                        from:
                            harbor:
                                to:
                                    definition:
                                        sso: true
                routes:
                    outbound:
                        sso:
                            enabled: true
                            hosts:
                                - keycloak.atum.test
                            ports:
                                - name: tls-keycloak
                                  number: 443
                                  protocol: TLS
                            resolution: NONE
                upstream:
                    caBundleSecretName: atum-sso-ca
                    core:
                        configureUserSettings: '{"auth_mode":"oidc_auth","oidc_admin_group":"atum-admins","oidc_auto_onboard":true,"oidc_client_id":"atum-harbor","oidc_client_secret":"${ATUM_HARBOR_CLIENT_SECRET}","oidc_endpoint":"https://keycloak.atum.test/auth/realms/master","oidc_extra_redirect_parms":{},"oidc_group_filter":"","oidc_groups_claim":"groups","oidc_name":"Keycloak","oidc_scope":"openid profile email groups","oidc_user_claim":"preferred_username","oidc_verify_cert":true}'
        headlamp:
            sso:
                client_id: atum-headlamp
                client_secret: ""
                enabled: true
            values:
                bigbang:
                    rbac:
                        clusterRoleBindings:
                            - name: atum-headlamp-admin
                              roleRef: cluster-admin
                              subjects:
                                - apiGroup: rbac.authorization.k8s.io
                                  kind: Group
                                  name: oidc:atum-admins
                        clusterRoles: []
                        enabled: true
                routes:
                    outbound:
                        sso:
                            resolution: NONE
                upstream:
                    clusterRoleBinding:
                        create: false
                    config:
                        oidc:
                            clientID: atum-headlamp
                            issuerURL: https://keycloak.atum.test/auth/realms/master
                            scopes: openid,profile,email,groups
                            secret:
                                create: false
                            usePKCE: true
                    env:
                        - name: SSL_CERT_DIR
                          value: /var/run/atum-sso
                    volumeMounts:
                        - mountPath: /var/run/atum-sso
                          name: atum-sso-ca
                          readOnly: true
                    volumes:
                        - name: atum-sso-ca
                          secret:
                            items:
                                - key: ca.pem
                                  path: ca.pem
                            secretName: tls-ca-sso
        keycloak:
            values:
                upstream:
                    secrets:
                        env:
                            stringData:
                                KEYCLOAK_ADMIN: atum-bootstrap
                                KEYCLOAK_ADMIN_PASSWORD: ${ATUM_IDENTITY_BOOTSTRAP_PASSWORD}
        vault:
            values:
                networkPolicies:
                    egress:
                        from:
                            vault:
                                to:
                                    definition:
                                        sso: true
                routes:
                    outbound:
                        sso:
                            enabled: true
                            hosts:
                                - keycloak.atum.test
                            ports:
                                - name: tls-keycloak
                                  number: 443
                                  protocol: TLS
                            resolution: NONE
                upstream:
                    server:
                        extraEnvironmentVars:
                            VAULT_CACERT: /var/run/atum-sso/ca.crt
                        volumeMounts:
                            - mountPath: /var/run/atum-sso
                              name: atum-sso-ca
                              readOnly: true
                        volumes:
                            - name: atum-sso-ca
                              secret:
                                secretName: atum-sso-ca
    grafana:
        sso:
            enabled: true
            grafana:
                allow_sign_up: true
                client_id: atum-grafana
                client_secret: ${ATUM_GRAFANA_CLIENT_SECRET}
                role_attribute_path: contains(groups[*], 'atum-admins') && 'Admin' || 'Viewer'
                scopes: openid,profile,email,groups
        values:
            upstream:
                grafana.ini:
                    auth.generic_oauth:
                        tls_client_ca: /etc/oidc/ca.pem
    kiali:
        sso:
            client_id: atum-kiali
            client_secret: ${ATUM_KIALI_CLIENT_SECRET}
            enabled: true
        values:
            routes:
                outbound:
                    sso:
                        resolution: NONE
    kyvernoReporter:
        sso:
            client_id: atum-policy-reporter
            client_secret: ${ATUM_POLICY_REPORTER_CLIENT_SECRET}
            enabled: true
        values:
            routes:
                inbound:
                    policy-reporter-ui:
                        hosts:
                            - policy.atum.test
            upstream:
                extraManifests:
                    - |
                      apiVersion: cert-manager.io/v1
                      kind: Certificate
                      metadata:
                        name: atum-sso-ca
                        namespace: kyverno-reporter
                      spec:
                        commonName: sso-ca.kyverno-reporter
                        dnsNames:
                          - sso-ca.kyverno-reporter
                        duration: 8760h
                        renewBefore: 720h
                        issuerRef:
                          group: cert-manager.io
                          kind: ClusterIssuer
                          name: atum-test-ca
                        secretName: atum-sso-ca
                ui:
                    extraVolumes:
                        volumeMounts:
                            - mountPath: /var/run/atum-sso
                              name: atum-sso-ca
                              readOnly: true
                        volumes:
                            - name: atum-sso-ca
                              secret:
                                items:
                                    - key: ca.crt
                                      path: ca.crt
                                secretName: atum-sso-ca
                    openIDConnect:
                        callbackUrl: https://policy.atum.test/callback
                        certificate: /var/run/atum-sso/ca.crt
                        clientId: atum-policy-reporter
                        clientSecret: ${ATUM_POLICY_REPORTER_CLIENT_SECRET}
                        discoveryUrl: https://keycloak.atum.test/auth/realms/master/.well-known/openid-configuration
                        enabled: true
    monitoring:
        sso:
            alertmanager:
                client_id: atum-alertmanager
                client_secret: ${ATUM_ALERTMANAGER_CLIENT_SECRET}
            enabled: true
            prometheus:
                client_id: atum-prometheus
                client_secret: ${ATUM_PROMETHEUS_CLIENT_SECRET}
        values:
            networkPolicies:
                egress:
                    from:
                        prometheus:
                            to:
                                definition:
                                    vaultIngress: true
    networkPolicies:
        egress:
            definitions:
                sso:
                    ports:
                        - port: 443
                          protocol: TCP
                        - port: 8443
                          protocol: TCP
                    to:
                        - ipBlock:
                            cidr: 10.77.0.21/32
                        - namespaceSelector:
                            matchLabels:
                                kubernetes.io/metadata.name: istio-gateway
                          podSelector:
                            matchLabels:
                                app.kubernetes.io/name: passthrough-ingressgateway
                                istio: ingressgateway
                vaultIngress:
                    ports:
                        - port: 443
                          protocol: TCP
                        - port: 8443
                          protocol: TCP
                    to:
                        - ipBlock:
                            cidr: 10.77.0.20/32
                        - namespaceSelector:
                            matchLabels:
                                kubernetes.io/metadata.name: istio-gateway
                          podSelector:
                            matchLabels:
                                app.kubernetes.io/name: public-ingressgateway
                                istio: ingressgateway
    packages:
        opensearch:
            istio:
                hardened:
                    matchLabels:
                        protect: keycloak
                hosts:
                    - destination:
                        port: 5601
                        protocol: http
                        service: opensearch-dashboards
                      domains:
                        - atum.test
                      gateways:
                        - istio-gateway/public-ingressgateway
                      names:
                        - opensearch
                      selectors:
                        - matchLabels:
                            protect: keycloak
            sso:
                enabled: true
        opensearch-dashboards:
            values:
                labels:
                    protect: keycloak
    sso:
        name: Keycloak
        oidc:
            authorization: https://keycloak.atum.test/auth/realms/master/protocol/openid-connect/auth
            claims:
                email: email
                groups: groups
                name: name
                username: preferred_username
            discoveryUrl: https://keycloak.atum.test/auth/realms/master/.well-known/openid-configuration
            endSession: https://keycloak.atum.test/auth/realms/master/protocol/openid-connect/logout
            jwksUri: https://keycloak.atum.test/auth/realms/master/protocol/openid-connect/certs
            token: https://keycloak.atum.test/auth/realms/master/protocol/openid-connect/token
            userinfo: https://keycloak.atum.test/auth/realms/master/protocol/openid-connect/userinfo
        url: https://keycloak.atum.test/auth/realms/master
