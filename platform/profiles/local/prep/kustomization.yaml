apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificates
  - load-balancer
configMapGenerator:
  - name: bigbang-target-values
    namespace: bigbang
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
