apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: bigbang
    namespace: flux-system
spec:
    dependsOn:
        - name: prep
        - name: platform-profile-prep
    force: false
    healthChecks:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          name: bigbang
          namespace: bigbang
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          name: cert-manager
          namespace: cert-manager
    interval: 10m
    path: ./platform/apps/bigbang
    prune: true
    retryInterval: 2m
    sourceRef:
        kind: GitRepository
        name: flux-system
    timeout: 35m
