apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bigbang
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 35m
  prune: true
  wait: true
  dependsOn:
    - name: prep
    - name: platform-profile-prep
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/apps/bigbang
