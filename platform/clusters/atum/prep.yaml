apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: prep
    namespace: flux-system
spec:
    force: false
    interval: 10m
    path: ./platform/apps/prep
    prune: true
    retryInterval: 2m
    sourceRef:
        kind: GitRepository
        name: flux-system
    timeout: 15m
    wait: false
