apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-profile-prep
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  postBuild:
    substitute:
      ATUM_PLATFORM_DOMAIN: ${ATUM_PLATFORM_DOMAIN}
  dependsOn:
    - name: prep
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/profiles/${ATUM_PLATFORM_PROFILE}/prep
