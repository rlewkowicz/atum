helperImage:
    repository: 10.77.0.9:32443/atum/busybox
    tag: 1.37.0
helperPod:
    resources:
        requests:
            cpu: 25m
            memory: 64Mi
health:
    readinessProbe:
        httpGet:
            path: /ready
            port: health
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
image:
    pullPolicy: IfNotPresent
    repository: 10.77.0.9:32443/atum/local-path-provisioner
    tag: v0.0.37
nodePathMap:
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
        - /var/lib/atum/local-path-provisioner
resources:
    requests:
        cpu: 25m
        memory: 64Mi
storageClass:
    create: true
    defaultClass: true
    defaultVolumeType: hostPath
    name: atum-local-path
    provisionerName: atum.dev/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
