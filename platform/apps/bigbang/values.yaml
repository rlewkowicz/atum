domain: atum.test
registryCredentials: null
imagePullPolicy: IfNotPresent
openshift: false
flux:
  interval: 2m
  timeout: 30m
  install:
    crds: CreateReplace
    disableWait: true
    disableWaitForJobs: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    disableWait: true
    disableWaitForJobs: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  driftDetection:
    mode: enabled
wrapper:
  sourceType: git
networkPolicies:
  enabled: true
  controlPlaneCidr: 0.0.0.0/0
istio:
  ambient:
    enabled: false
istioCNI:
  enabled: false
gatewayAPI:
  enabled: false
istioCRDs:
  enabled: true
  sourceType: git
  git: {}
istiod:
  enabled: true
  sourceType: git
  git: {}
  values:
    networkPolicies:
      egress:
        defaults:
          allowInNamespace:
            enabled: true
      ingress:
        to:
          "istiod:[443,15017]":
            from:
              cidr:
                0.0.0.0/0: false
              definition:
                kubeAPI: true
    upstream:
      global: {}
      pilot:
        autoscaleEnabled: false
        replicaCount: 1
istioGateway:
  enabled: true
  sourceType: git
  git: {}
  values:
    gateways:
      public:
        waitJob:
          enabled: false
        upstream:
          replicaCount: 1
          autoscaling:
            enabled: false
          global: {}
      passthrough:
        waitJob:
          enabled: false
        upstream:
          replicaCount: 1
          autoscaling:
            enabled: false
          global: {}
ztunnel:
  enabled: false
kiali:
  enabled: true
  sourceType: git
  git: {}
  values:
    waitJob:
      enabled: false
    upstream:
      image: {}
      cr:
        spec:
          deployment:
            replicas: 1
gatekeeper:
  enabled: false
kyverno:
  enabled: true
  sourceType: git
  git: {}
  values:
    global:
      image: {}
    waitJob:
      enabled: false
    upstream:
      features:
        forceFailurePolicyIgnore:
          enabled: true
        logging:
          verbosity: 0
      config: {}
      crds:
        groups:
          image: {}
        migration:
          image: {}
      webhooksCleanup:
        image: {}
      policyReportsCleanup:
        image: {}
      cleanupJobs:
        admissionReports:
          image: {}
        clusterAdmissionReports:
          image: {}
        updateRequests:
          image: {}
        ephemeralReports:
          image: {}
        clusterEphemeralReports:
          image: {}
      admissionController:
        replicas: 1
        apiPriorityAndFairness: true
        initContainer:
          image: {}
        container:
          image: {}
      backgroundController:
        replicas: 1
        image: {}
      cleanupController:
        replicas: 1
        image: {}
      reportsController:
        replicas: 1
        image: {}
      test:
        image: {}
kyvernoPolicies:
  enabled: true
  sourceType: git
  git: {}
  values:
    bbtests:
      enabled: false
    validationFailureAction: Audit
    waitJob:
      enabled: false
    policies:
      add-default-securitycontext:
        exclude:
          any:
            - resources:
                namespaces:
                  - local-path-storage
      update-automountserviceaccounttokens:
        enabled: false
      restrict-image-registries:
        skipOverlayMerge: true
        parameters:
          allow:
            - 10.77.0.9:32443
kyvernoReporter:
  enabled: true
  sourceType: git
  git: {}
  values:
    waitJob:
      enabled: false
    upstream:
      replicaCount: 1
      image: {}
      ui:
        enabled: true
        replicaCount: 1
        image: {}
      plugin:
        kyverno:
          enabled: true
          replicaCount: 1
          image: {}
elasticsearchKibana:
  enabled: false
eckOperator:
  enabled: false
fluentbit:
  enabled: true
  sourceType: git
  git: {}
  istio:
    injection: enabled
  values:
    waitJob:
      enabled: false
    bbtests:
      enabled: false
    networkPolicies:
      egress:
        from:
          fluent-bit:
            to:
              k8s:
                "opensearch/opensearch-cluster-master:9200":
                  enabled: true
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: opensearch
    upstream:
      image: {}
      hotReload:
        enabled: false
      config:
        outputs: |
          [OUTPUT]
              Name                opensearch
              Match               kube.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Retry_Limit         False
              tls                 Off
          [OUTPUT]
              Name                opensearch
              Match               host.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Logstash_Format     On
              Logstash_Prefix     node
              Retry_Limit         False
              tls                 Off
alloy:
  enabled: false
loki:
  enabled: false
neuvector:
  enabled: false
tempo:
  enabled: true
  sourceType: git
  git: {}
  values:
    waitJob:
      enabled: false
    upgradeJob:
      image:
        imagePullPolicy: IfNotPresent
    bbtests:
      enabled: false
    upstream:
      replicas: 1
      tempo: {}
      tempoQuery:
        enabled: false
prometheusOperatorCRDs:
  enabled: true
  sourceType: git
  git: {}
monitoring:
  enabled: true
  sourceType: git
  git: {}
  values:
    waitJob:
      enabled: false
    bbtests:
      enabled: false
    blackboxExporter:
      enabled: false
    snmpExporter:
      enabled: false
    upstream:
      alertmanager:
