          replicas: 1
          image: {}
      prometheus:
        prometheusSpec:
          replicas: 1
          image: {}
          podMetadata:
            annotations:
              traffic.sidecar.istio.io/includeOutboundIPRanges: "*"
              vault.hashicorp.com/agent-init-first: "false"
              vault.hashicorp.com/service: "http://vault-vault.vault.svc:8200"
      prometheusOperator:
        admissionWebhooks:
          deployment:
            replicas: 1
          patch:
            image: {}
        image: {}
        prometheusConfigReloader:
          image: {}
        thanosImage: {}
        kubectlImage: {}
        cleanupProxy:
          image: {}
      kube-state-metrics:
        image: {}
      prometheus-node-exporter:
        image: {}
grafana:
  enabled: true
  sourceType: git
  git: {}
  values:
    global: {}
    waitJob:
      enabled: false
    autoRollingUpgrade:
      image: {}
    upstream:
      replicas: 1
      autoscaling:
        enabled: false
      image: {}
      livenessProbe:
        initialDelaySeconds: 600
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      downloadDashboardsImage: {}
      initChownData:
        image: {}
      testFramework:
        enabled: false
      sidecar:
        image: {}
      imageRenderer:
        enabled: false
twistlock:
  enabled: false
bbctl:
  enabled: false
renovate:
  enabled: false
addons:
  argocd:
    enabled: false
  anchoreEnterprise:
    enabled: false
  authservice:
    enabled: true
    sourceType: git
    git: {}
    chains:
      local:
        callback_uri: https://localhost/login
        client_id: local_id
        client_secret: local_secret
        logout_path: /local
        match:
          header: :authority
          prefix: localhost
    values:
      waitJob:
        enabled: false
      replicaCount: 1
      autoscaling:
        enabled: false
      image: {}
  externalSecrets:
    enabled: false
  fortify:
    enabled: false
  gitlab:
    enabled: true
    sourceType: git
    git: {}
    flux:
      upgrade:
        disableHooks: true
    values:
      waitJob:
        enabled: false
      global:
        hosts:
          domain: atum.test
        kas:
          enabled: true
        certificates:
          image: {}
        kubectl:
          image: {}
        gitlabBase:
          image: {}
      upstream:
        global:
          hosts:
            domain: atum.test
          appConfig:
            incomingEmail:
              enabled: false
          kas:
            enabled: true
          pages:
            enabled: false
        nginx-ingress:
          enabled: false
        upgradeCheck:
          image: {}
        redis:
          global:
            security:
              allowInsecureImages: true
          image: {}
          metrics:
            image: {}
        postgresql:
          global:
            security:
              allowInsecureImages: true
          image: {}
          postgresqlSharedPreloadLibraries: ""
        registry:
          hpa:
            minReplicas: 1
            maxReplicas: 1
          image: {}
        gitlab:
          toolbox:
            replicas: 1
            image: {}
          migrations:
            image: {}
          webservice:
            minReplicas: 1
            maxReplicas: 1
            image: {}
            workhorse: {}
          sidekiq:
            minReplicas: 1
            maxReplicas: 1
            image: {}
          gitlab-shell:
            minReplicas: 1
            maxReplicas: 1
            image: {}
          gitaly:
            image: {}
          gitlab-exporter:
            enabled: false
          mailroom:
            enabled: false
          gitlab-pages:
            enabled: false
          kas:
            image: {}
          praefect:
            image: {}
        minio:
          minioMc: {}
        shared-secrets:
          annotations:
            sidecar.istio.io/inject: "false"
          selfsign:
            keySize: "2048"
            image: {}
        bbtests:
          enabled: false
  gitlabRunner:
    enabled: false
  harbor:
    enabled: true
    sourceType: git
    git: {}
    values:
      bbtests:
        enabled: false
      postgresql:
        global:
          security:
            allowInsecureImages: true
        image: {}
        postgresqlSharedPreloadLibraries: ""
      redis-bb:
        upstream:
          global:
            security:
              allowInsecureImages: true
          image: {}
