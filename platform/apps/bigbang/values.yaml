# Target-independent site intent for the selected Big Bang release. Package
# coordinates and image projections are generated separately by
# `atum pull updates`; target facts live in the active profile.

alloy:
  enabled: false

loki:
  enabled: false

neuvector:
  enabled: false

bbctl:
  enabled: false

fluentbit:
  enabled: true
  values:
    upstream:
      config:
        outputs: |
          [OUTPUT]
              Name                opensearch
              Match               kube.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Retry_Limit         False
              tls                 Off
          [OUTPUT]
              Name                opensearch
              Match               host.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Logstash_Format     On
              Logstash_Prefix     node
              Retry_Limit         False
              tls                 Off

grafana:
  values:
    upstream:
      grafana.ini:
        # The legacy Angular piechart plugin is unsupported by the selected
        # Grafana release. Use Grafana's native pie visualization instead.
        plugin.grafana-piechart-panel: null

addons:
  authservice:
    enabled: true

  gitlab:
    enabled: true
    dependsOn:
      - name: postgresql
        namespace: postgresql
      - name: redis
        namespace: redis
      - name: garage
        namespace: garage
    database:
      host: postgresql-rw.postgresql.svc.cluster.local
      port: 5432
      database: gitlabhq_production
      username: gitlab
    objectStorage:
      type: minio
      endpoint: http://garage.garage.svc.cluster.local:3900
      regionendpoint: http://garage.garage.svc.cluster.local:3900
      region: garage
    values:
      global:
        redis:
          host: redis-master.redis.svc.cluster.local
          port: 6379
      networkPolicies:
        egress:
          definitions:
            database-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: postgresql
              ports:
                - port: 5432
                  protocol: TCP
            redis-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: redis
              ports:
                - port: 6379
                  protocol: TCP
            storage-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: garage
              ports:
                - port: 3900
                  protocol: TCP

  harbor:
    enabled: true
    values:
      postgresql:
        global:
          # The selected Bitnami subchart defaults to an Iron Bank-specific
          # restricted OpenSSL provider. Atum delivers the official upstream
          # PostgreSQL image and its minimal chart-compatibility layer instead.
          defaultFips: off

  headlamp:
    enabled: true

  keycloak:
    enabled: true
    values:
      postgresql:
        global:
          # Match the standard official PostgreSQL distribution rather than
          # claiming an unavailable Iron Bank FIPS provider.
          defaultFips: off

  vault:
    enabled: true
    values:
      autoInit:
        enabled: true

packages:
  cloudnative-pg:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/cloudnative-pg.git
      path: chart
      tag: 0.29.0-bb.0
    namespace:
      name: cloudnative-pg
    istio:
      injection: disabled

  postgresql:
    enabled: true
    sourceType: git
    git:
      repo: https://github.com/cloudnative-pg/charts.git
      path: charts/cluster
      tag: cluster-v0.8.1
    namespace:
      name: postgresql
    istio:
      injection: disabled
    bbCommonValues: false
    dependsOn:
      - name: cloudnative-pg
        namespace: cloudnative-pg
    values:
      fullnameOverride: postgresql
      type: postgresql
      version:
        postgresql: "17"
      cluster:
        initdb:
          database: gitlabhq_production
          owner: gitlab
          secret:
            name: postgresql-app
          postInitApplicationSQL:
            - CREATE EXTENSION IF NOT EXISTS pg_trgm;
            - CREATE EXTENSION IF NOT EXISTS btree_gist;
            - CREATE EXTENSION IF NOT EXISTS plpgsql;
            - CREATE EXTENSION IF NOT EXISTS amcheck;
            - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        postgresql:
          parameters:
            max_connections: "200"
          shared_preload_libraries:
            - pg_stat_statements

  redis:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/redis.git
      path: chart
      tag: 27.0.14-bb.0
    namespace:
      name: redis
    istio:
      injection: disabled
    bbCommonValues: false
    values:
      networkPolicies:
        enabled: true
      upstream:
        nameOverride: redis
        fullnameOverride: redis
        architecture: standalone
        auth:
          enabled: true
          usePasswordFiles: true
        metrics:
          enabled: false
        networkPolicy:
          enabled: true
          allowExternal: false
          allowExternalEgress: false
          ingressNSMatchLabels:
            kubernetes.io/metadata.name: gitlab
        replica:
          replicaCount: 0

  garage:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/garage.git
      path: chart
      tag: 0.9.3-bb.2
    namespace:
      name: garage
    istio:
      injection: disabled
    values:
      fullnameOverride: garage
      garageInit:
        enabled: true
        zone: gitlab
        region: garage
        consumers:
          - name: gitlab
            buckets:
              - gitlab-agent-plan-content
              - gitlab-artifacts
              - gitlab-backup
              - gitlab-backup-tmp
              - gitlab-ci-secure-files
              - gitlab-dependency-proxy
              - gitlab-lfs
              - gitlab-mr-diffs
              - gitlab-packages
              - gitlab-pages
              - gitlab-pseudo
              - gitlab-registry
              - gitlab-terraform-state
              - gitlab-uploads
      upstream:
        fullnameOverride: garage
        environment:
          - name: GARAGE_ADMIN_TOKEN

  opensearch-operator:
    enabled: true
    namespace:
      name: opensearch-operator
    wrapper:
      enabled: true
    istio:
      injection: enabled

  opensearch:
    enabled: true
    namespace:
      name: opensearch
    wrapper:
      enabled: true
    istio:
      injection: enabled
      hardened:
        enabled: true
        customAuthorizationPolicies:
          - name: allow-fluentbit-opensearch
            enabled: true
            spec:
              action: ALLOW
              selector:
                matchLabels:
                  app.kubernetes.io/name: opensearch
              rules:
                - from:
                    - source:
                        principals:
                          - cluster.local/ns/fluentbit/sa/fluentbit-fluent-bit
                  to:
                    - operation:
                        ports:
                          - "9200"
    network:
      additionalPolicies:
        - name: allow-fluentbit-opensearch
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: opensearch
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: fluentbit
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: fluent-bit
                ports:
                  - port: 9200
                    protocol: TCP
    dependsOn:
      - name: opensearch-operator
        namespace: opensearch-operator
    values:
      singleNode: true
      replicas: 1
      extraEnvs:
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
      persistence:
        enableInitChown: false
      sysctlInit:
        enabled: false

  opensearch-dashboards:
    enabled: true
    namespace:
      create: false
      name: opensearch
    helmRelease:
      namespace: opensearch
    dependsOn:
      - name: opensearch
        namespace: opensearch
    values:
      opensearchHosts: http://opensearch-cluster-master:9200
      replicaCount: 1
      autoscaling:
        enabled: false
