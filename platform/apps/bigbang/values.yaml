      upstream:
        nginx:
          image: {}
        portal:
          image: {}
        core:
          image: {}
        jobservice:
          image: {}
        registry:
          registry:
            image: {}
          controller:
            image: {}
        trivy:
          enabled: false
        exporter:
          image: {}
  headlamp:
    enabled: true
    sourceType: git
    git: {}
    sso:
      enabled: false
    values:
      waitJob:
        enabled: false
      upstream:
        image: {}
  keycloak:
    enabled: true
    sourceType: git
    git: {}
    values:
      upstream:
        global:
          security:
            allowInsecureImages: true
        replicas: 1
        image: {}
      postgresql:
        global:
          security:
            allowInsecureImages: true
        image: {}
        postgresqlSharedPreloadLibraries: ""
