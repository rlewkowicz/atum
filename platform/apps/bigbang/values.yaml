# Target-independent site intent for the selected Big Bang release. Package
# coordinates and image projections are generated separately by
# `atum pull updates`; target facts live in the active profile.

alloy:
  enabled: false

loki:
  enabled: false

neuvector:
  enabled: false

bbctl:
  enabled: false

fluentbit:
  enabled: true
  values:
    networkPolicies:
      egress:
        from:
          fluent-bit:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: fluent-bit
                app.kubernetes.io/instance: fluentbit
            to:
              k8s:
                opensearch/opensearch:9200:
                  enabled: true
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: opensearch
                      app.kubernetes.io/instance: opensearch
    upstream:
      envFrom:
        - secretRef:
            name: fluentbit-opensearch-credentials
      extraVolumes:
        - name: flb-storage
          hostPath:
            path: /var/log/flb-storage/
            type: DirectoryOrCreate
        - name: opensearch-ca
          secret:
            secretName: fluentbit-opensearch-ca
      extraVolumeMounts:
        - name: flb-storage
          mountPath: /var/log/flb-storage/
          readOnly: false
        - name: opensearch-ca
          mountPath: /fluent-bit/tls
          readOnly: true
      config:
        outputs: |
          [OUTPUT]
              Name                opensearch
              Match               kube.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Logstash_Format     On
              Logstash_Prefix     kubernetes
              Retry_Limit         False
              HTTP_User           ${OPENSEARCH_USER}
              HTTP_Passwd         ${OPENSEARCH_PASSWORD}
              tls                 On
              tls.verify          On
              tls.ca_file         /fluent-bit/tls/ca.crt
          [OUTPUT]
              Name                opensearch
              Match               host.*
              Host                opensearch-cluster-master.opensearch.svc.cluster.local
              Port                9200
              Suppress_Type_Name  On
              Logstash_Format     On
              Logstash_Prefix     node
              Retry_Limit         False
              HTTP_User           ${OPENSEARCH_USER}
              HTTP_Passwd         ${OPENSEARCH_PASSWORD}
              tls                 On
              tls.verify          On
              tls.ca_file         /fluent-bit/tls/ca.crt

addons:
  authservice:
    enabled: true

  gitlab:
    enabled: true
    dependsOn:
      - name: postgresql
        namespace: postgresql
      - name: redis
        namespace: redis
      - name: garage
        namespace: garage
    database:
      host: postgresql-rw.postgresql.svc.cluster.local
      port: 5432
      database: gitlabhq_production
      username: gitlab
    objectStorage:
      type: minio
      endpoint: http://garage.garage.svc.cluster.local:3900
      regionendpoint: http://garage.garage.svc.cluster.local:3900
      region: garage
    values:
      global:
        redis:
          host: redis-master.redis.svc.cluster.local
          port: 6379
      networkPolicies:
        egress:
          definitions:
            database-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: postgresql
              ports:
                - port: 5432
                  protocol: TCP
            redis-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: redis
              ports:
                - port: 6379
                  protocol: TCP
            storage-subnets:
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: garage
              ports:
                - port: 3900
                  protocol: TCP

  harbor:
    enabled: true

  headlamp:
    enabled: true
    values:
      waitJob:
        enabled: false

  keycloak:
    enabled: true

  vault:
    enabled: true
    values:
      autoInit:
        enabled: true

istioGateway:
  values:
    shared:
      waitJob:
        enabled: false

kiali:
  values:
    waitJob:
      enabled: false

kyvernoPolicies:
  values:
    waitJob:
      enabled: false

packages:
  cloudnative-pg:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/cloudnative-pg.git
      path: chart
      tag: 0.29.0-bb.0
    namespace:
      name: cloudnative-pg
    istio:
      injection: disabled

  postgresql:
    enabled: true
    sourceType: git
    git:
      repo: https://github.com/cloudnative-pg/charts.git
      path: charts/cluster
      tag: cluster-v0.8.1
    namespace:
      name: postgresql
    istio:
      injection: disabled
    bbCommonValues: false
    dependsOn:
      - name: cloudnative-pg
        namespace: cloudnative-pg
    values:
      fullnameOverride: postgresql
      type: postgresql
      version:
        postgresql: "17"
      cluster:
        initdb:
          database: gitlabhq_production
          owner: gitlab
          secret:
            name: postgresql-app
          postInitApplicationSQL:
            - CREATE EXTENSION IF NOT EXISTS pg_trgm;
            - CREATE EXTENSION IF NOT EXISTS btree_gist;
            - CREATE EXTENSION IF NOT EXISTS plpgsql;
            - CREATE EXTENSION IF NOT EXISTS amcheck;
            - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        postgresql:
          parameters:
            max_connections: "200"
          shared_preload_libraries:
            - pg_stat_statements

  redis:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/redis.git
      path: chart
      tag: 27.0.14-bb.0
    namespace:
      name: redis
    istio:
      injection: disabled
    bbCommonValues: false
    values:
      networkPolicies:
        enabled: true
      upstream:
        nameOverride: redis
        fullnameOverride: redis
        architecture: standalone
        auth:
          enabled: true
          usePasswordFiles: true
        metrics:
          enabled: false
        networkPolicy:
          enabled: true
          allowExternal: false
          allowExternalEgress: false
          ingressNSMatchLabels:
            kubernetes.io/metadata.name: gitlab
        replica:
          replicaCount: 0
          autoscaling:
            enabled: false

  garage:
    enabled: true
    sourceType: git
    git:
      repo: https://repo1.dso.mil/big-bang/product/maintained/garage.git
      path: chart
      tag: 0.9.3-bb.2
    namespace:
      name: garage
    istio:
      injection: disabled
    values:
      fullnameOverride: garage
      bb-common:
        networkPolicies:
          ingress:
            to:
              garage:3900:
                from:
                  k8s:
                    gitlab/gitlab: true
      garageInit:
        enabled: true
        zone: gitlab
        region: garage
        consumers:
          - name: gitlab
            buckets:
              - gitlab-agent-plan-content
              - gitlab-artifacts
              - gitlab-backup
              - gitlab-backup-tmp
              - gitlab-ci-secure-files
              - gitlab-dependency-proxy
              - gitlab-lfs
              - gitlab-mr-diffs
              - gitlab-packages
              - gitlab-pages
              - gitlab-pseudo
              - gitlab-registry
              - gitlab-terraform-state
              - gitlab-uploads
      upstream:
        fullnameOverride: garage
        environment:
          - name: GARAGE_ADMIN_TOKEN

  opensearch:
    enabled: true
    namespace:
      name: opensearch
    wrapper:
      enabled: true
    istio:
      injection: enabled
      hardened:
        enabled: true
        customAuthorizationPolicies:
          - name: allow-fluentbit-opensearch
            enabled: true
            spec:
              action: ALLOW
              selector:
                matchLabels:
                  app.kubernetes.io/name: opensearch
                  app.kubernetes.io/instance: opensearch
              rules:
                - from:
                    - source:
                        principals:
                          - cluster.local/ns/fluentbit/sa/fluentbit-fluent-bit
                  to:
                    - operation:
                        ports:
                          - "9200"
    network:
      additionalPolicies:
        - name: allow-fluentbit-opensearch
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: opensearch
                app.kubernetes.io/instance: opensearch
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: fluentbit
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: fluent-bit
                        app.kubernetes.io/instance: fluentbit
                ports:
                  - port: 9200
                    protocol: TCP
    values:
      config:
        opensearch.yml: |
          plugins.security.ssl.transport.pemcert_filepath: certificates/tls.crt
          plugins.security.ssl.transport.pemkey_filepath: certificates/tls.key
          plugins.security.ssl.transport.pemtrustedcas_filepath: certificates/ca.crt
          plugins.security.ssl.transport.enforce_hostname_verification: true
          plugins.security.ssl.http.enabled: true
          plugins.security.ssl.http.pemcert_filepath: certificates/tls.crt
          plugins.security.ssl.http.pemkey_filepath: certificates/tls.key
          plugins.security.ssl.http.pemtrustedcas_filepath: certificates/ca.crt
          plugins.security.nodes_dn:
            - CN=opensearch-node
          plugins.security.ssl.certificates_hot_reload.enabled: true
          plugins.security.allow_default_init_securityindex: true
      securityConfig:
        actionGroupsSecret: opensearch-security-config
        configSecret: opensearch-security-config
        internalUsersSecret: opensearch-security-config
        rolesSecret: opensearch-security-config
        rolesMappingSecret: opensearch-security-config
        tenantsSecret: opensearch-security-config
      secretMounts:
        - name: opensearch-node-tls
          secretName: opensearch-node-tls
          path: /usr/share/opensearch/config/certificates
  opensearch-dashboards:
    enabled: true
    namespace:
      create: false
      name: opensearch
    helmRelease:
      namespace: opensearch
    dependsOn:
      - name: opensearch
        namespace: opensearch
    values:
      opensearchHosts: https://opensearch-cluster-master.opensearch.svc.cluster.local:9200
      opensearchAccount:
        secret: opensearch-dashboards-credentials
      secretMounts:
        - name: opensearch-ca
          secretName: opensearch-dashboards-ca
          path: /usr/share/opensearch-dashboards/config/certificates
      config:
        opensearch_dashboards.yml: |
          opensearch.ssl.certificateAuthorities:
            - /usr/share/opensearch-dashboards/config/certificates/ca.crt
          opensearch.ssl.verificationMode: full
