  velero:
    enabled: true
    sourceType: git
    git: {}
    values:
      waitJob:
        enabled: false
      upstream:
        image: {}
        credentials:
          useSecret: true
          secretContents:
            cloud: |
              [default]
              aws_access_key_id=atum-placeholder
              aws_secret_access_key=atum-placeholder
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: atum-velero
              default: true
              credential:
                name: velero
                key: cloud
              config:
                region: auto
                s3ForcePathStyle: "true"
                s3Url: https://ewr1.vultrobjects.com
          volumeSnapshotLocation:
            - name: default
              provider: aws
              credential:
                name: velero
                key: cloud
              config:
                region: auto
          deployNodeAgent: true
      kubectl:
        image: {}
      bbtests:
        enabled: false
packages:
  opensearch-operator:
    enabled: true
    sourceType: helmRepo
    namespace:
      create: true
      name: opensearch-operator
    helmRepo:
      repoName: opensearch-operator
      chartName: opensearch-operator
    includeDefaultDependsOn: true
    wrapper:
      enabled: true
    istio:
      injection: enabled
      hardened:
        enabled: true
        matchLabels: {}
    network:
      allowControlPlaneEgress: true
    dependsOn:
      - name: opensearch-operator-wrapper
        namespace: opensearch-operator
    values:
      manager:
        image:
          pullPolicy: IfNotPresent
  opensearch:
    enabled: true
    sourceType: helmRepo
    namespace:
      create: true
      name: opensearch
    helmRepo:
      repoName: opensearch
      chartName: opensearch
    includeDefaultDependsOn: true
    wrapper:
      enabled: true
    istio:
      injection: enabled
      hardened:
        enabled: true
        matchLabels: {}
        customAuthorizationPolicies:
          - name: allow-fluentbit-opensearch
            enabled: true
            spec:
              action: ALLOW
              selector:
                matchLabels:
                  app.kubernetes.io/name: opensearch
              rules:
                - from:
                    - source:
                        principals:
                          - cluster.local/ns/fluentbit/sa/fluentbit-fluent-bit
                  to:
                    - operation:
                        ports:
                          - "9200"
    network:
      additionalPolicies:
        - name: allow-fluentbit-opensearch
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: opensearch
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: fluentbit
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: fluent-bit
                ports:
                  - port: 9200
                    protocol: TCP
    dependsOn:
      - name: opensearch-operator
        namespace: opensearch-operator
      - name: opensearch-wrapper
        namespace: opensearch
    values:
      singleNode: true
      replicas: 1
      image: {}
      extraEnvs:
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
      persistence:
        enableInitChown: false
      sysctlInit:
        enabled: false
  opensearch-dashboards:
    enabled: true
    sourceType: helmRepo
    namespace:
      create: false
      name: opensearch
    helmRelease:
      namespace: opensearch
    helmRepo:
      repoName: opensearch
      chartName: opensearch-dashboards
    includeDefaultDependsOn: true
    dependsOn:
      - name: opensearch
        namespace: opensearch
    values:
      opensearchHosts: http://opensearch-cluster-master:9200
      replicaCount: 1
      autoscaling:
        enabled: false
      image: {}
