apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: bigbang
    namespace: bigbang
spec:
    chart:
        spec:
            chart: ./chart
            interval: 10m
            reconcileStrategy: Revision
            sourceRef:
                kind: GitRepository
                name: bigbang
                namespace: bigbang
    driftDetection:
        mode: enabled
    install:
        crds: CreateReplace
        disableWait: true
        strategy:
            name: RetryOnFailure
            retryInterval: 5m
    interval: 10m
    releaseName: bigbang
    targetNamespace: bigbang
    timeout: 30m
    upgrade:
        crds: CreateReplace
        disableWait: true
        strategy:
            name: RetryOnFailure
            retryInterval: 5m
    valuesFrom:
        - kind: ConfigMap
          name: bigbang-operational-values
          valuesKey: values.yaml
        - kind: ConfigMap
          name: bigbang-generated-values
          valuesKey: values.yaml
        - kind: ConfigMap
          name: bigbang-target-values
          valuesKey: values.yaml
        - kind: Secret
          name: atum-platform-stateful-values
          valuesKey: values.yaml
        - kind: Secret
          name: atum-platform-stateful-values
          targetPath: packages.garage.values.garageInit.adminToken
          valuesKey: garage-admin-token
        - kind: Secret
          name: atum-platform-stateful-values
          targetPath: packages.garage.values.upstream.environment[0].value
          valuesKey: garage-admin-token
        - kind: Secret
          name: atum-platform-stateful-values
          targetPath: packages.garage.values.garageInit.consumers[0].credentials.accessKeyId
          valuesKey: garage-access-key-id
        - kind: Secret
          name: atum-platform-stateful-values
          targetPath: packages.garage.values.garageInit.consumers[0].credentials.secretAccessKey
          valuesKey: garage-secret-access-key
        - kind: Secret
          name: atum-platform-identity-values
          optional: true
          valuesKey: values.yaml
        - kind: Secret
          name: atum-sso-ca
          optional: true
          targetPath: sso.certificateAuthority.cert
          valuesKey: ca.crt
