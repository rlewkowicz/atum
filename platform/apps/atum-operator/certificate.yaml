apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: atum-provider-ca
  namespace: atum-system
spec:
  commonName: provider-ca.atum-system
  dnsNames:
    - provider-ca.atum-system
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: atum-test-ca
  secretName: atum-provider-ca
