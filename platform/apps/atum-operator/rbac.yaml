apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atum-operator
  namespace: atum-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atum-operator
subjects:
  - kind: ServiceAccount
    name: atum-operator
    namespace: atum-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atum-operator-vault-token
  namespace: vault
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vault-token]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atum-operator-vault-token
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atum-operator-vault-token
subjects:
  - kind: ServiceAccount
    name: atum-operator
    namespace: atum-system
